name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk AgeOfAndroid-${GITHUB_REF_NAME}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: AgeOfAndroid-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            APK à installer directement sur un téléphone Android 8.0+ (voir le README, section « Installer sur son téléphone »).
